```html
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self' https:;
      script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
      connect-src 'self' https://*.supabase.co;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
    "
  >

  <title>Eliana's Nails - Owner</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Pinyon+Script&display=swap"
    rel="stylesheet"
  >

</head>


<body class="owner-page">


  <!-- OWNER NAVIGATION -->

  <header>

    <nav>

      <a href="appointments.html">
        <u>Current</u>
      </a>

      <a href="apptpast.html">
        Past
      </a>

    </nav>

  </header>


  <div class="background"></div>


  <!-- OWNER APPOINTMENT MANAGER -->

  <section class="booking">


    <h2>
      Appointment Manager
    </h2>


    <p
      id="appointmentCounter"
      class="appointment-counter"
    >
      Total Appointments: 0
    </p>


    <div class="calendar-layout">


      <!-- CALENDAR -->

      <div class="calendar-panel">

        <div class="calendar-header">

          <button
            id="prevMonth"
            type="button"
          >
            &lt;
          </button>


          <h3 id="monthYear">
            Loading...
          </h3>


          <button
            id="nextMonth"
            type="button"
          >
            &gt;
          </button>

        </div>


        <div class="calendar-weekdays">

          <div>Sun</div>
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
          <div>Sat</div>

        </div>


        <div
          id="calendarGrid"
          class="calendar-grid"
        >

          <p>
            Loading calendar...
          </p>

        </div>

      </div>


      <!-- DAILY APPOINTMENTS -->

      <div class="appointments-panel">

        <h3 id="selectedDateTitle">
          Select a Day
        </h3>


        <div id="dailyAppointments">

          <p class="no-selection">
            Click a date on the calendar to see
            appointments.
          </p>

        </div>

      </div>


      <!-- APPOINTMENT DETAILS -->

      <div class="details-panel">

        <h3>
          Appointment Details
        </h3>


        <div id="appointmentDetails">

          <p class="no-selection">
            Select an appointment.
          </p>

        </div>

      </div>

    </div>


    <br>


    <!-- LOGOUT -->

    <button
      id="logoutBtn"
      type="button"
    >
      Logout
    </button>


    <br><br>


    <a
      href="index.html"
      class="back-link"
    >
      Back to Website
    </a>


  </section>


  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- OWNER APPOINTMENT JAVASCRIPT -->

  <script src="appointments.js?v=5"></script>


</body>

</html>
```

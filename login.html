<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Eliana's Nails - Login</title>

  <link rel="stylesheet" href="styles.css">

</head>


<body>

  <div class="background"></div>


  <section class="booking">

    <h2>Login</h2>


    <input
      type="email"
      id="username"
      placeholder="Email"
      autocomplete="email"
    >


    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      id="loginBtn"
      type="button"
    >
      Login
    </button>


    <button
      id="createAccountBtn"
      type="button"
    >
      Create Account
    </button>


    <p id="loginMessage"></p>

  </section>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- LOGIN CODE -->

  <script>

    const SUPABASE_URL =
      "https://kyonstvpolakjhrecqcj.supabase.co";


    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5b25zdHZwb2xha2pocmVjcWNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTYxMjUsImV4cCI6MjA5NzI3MjEyNX0.oq6v7gEy8FJPh4NI3ngUYybwJcHF6rW6qkNtepCxr7Y";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const loginBtn =
      document.getElementById("loginBtn");


    const createAccountBtn =
      document.getElementById("createAccountBtn");


    const message =
      document.getElementById("loginMessage");


    // =====================================
    // LOGIN
    // =====================================

    loginBtn.addEventListener(
      "click",
      async function () {

        const email =
          document.getElementById("username")
            .value
            .trim();


        const password =
          document.getElementById("password")
            .value;


        message.textContent = "";


        if (!email || !password) {

          message.textContent =
            "Please enter your email and password.";

          return;
        }


        message.textContent =
          "Logging in...";


        const { data, error } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          console.error(error);

          message.textContent =
            error.message;

          return;
        }


        console.log(
          "Login successful:",
          data.user
        );


        message.textContent =
          "Login successful!";


        window.location.href =
          "myappointments.html";

      }
    );


    // =====================================
    // CREATE ACCOUNT
    // =====================================

    createAccountBtn.addEventListener(
      "click",
      async function () {

        const email =
          document.getElementById("username")
            .value
            .trim();


        const password =
          document.getElementById("password")
            .value;


        message.textContent = "";


        if (!email || !password) {

          message.textContent =
            "Enter an email and password to create your account.";

          return;
        }


        if (password.length < 6) {

          message.textContent =
            "Password must be at least 6 characters.";

          return;
        }


        message.textContent =
          "Creating account...";


        const { data, error } =
          await supabaseClient.auth
            .signUp({

              email: email,

              password: password

            });


        if (error) {

          console.error(error);

          message.textContent =
            error.message;

          return;
        }


        console.log(
          "Account created:",
          data.user
        );


        // Email confirmation required

        if (data.user && !data.session) {

          message.textContent =
            "Account created! Check your email to confirm your account.";

          return;
        }


        // Confirmation not required

        if (data.session) {

          message.textContent =
            "Account created!";


          window.location.href =
            "myappointments.html";

        }

      }
    );

  </script>

</body>
</html>

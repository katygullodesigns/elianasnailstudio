<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Eliana's Nails - Login</title>

  <link rel="stylesheet" href="styles.css">

</head>


<body>

  <div class="background"></div>


  <section class="booking">

    <h2>Login</h2>


    <input
      type="email"
      id="username"
      placeholder="Email"
      autocomplete="email"
    >


    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      id="loginBtn"
      type="button"
    >
      Login
    </button>


    <button
      id="createAccountBtn"
      type="button"
    >
      Create Account
    </button>


    <p id="loginMessage"></p>

  </section>


  <!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

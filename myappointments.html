<body>

  <div class="background"></div>

  <section class="booking-page">

    <!-- MY APPOINTMENTS -->
    <div class="my-appointments">
      <h2>My Appointments</h2>

      <p id="userEmail"></p>

      <div id="appointments">
        <p>Loading appointments...</p>
      </div>
    </div>


    <!-- BOOKING -->
    <section id="book" class="booking-section">

      <div class="booking-layout">

        <!-- LEFT: IMAGE -->
        <div class="work">
          <img src="images/elianawork.svg" alt="Eliana">
        </div>


        <!-- RIGHT: FORM -->
        <div class="booking-form">

          <h2>Book</h2>

          <input
            type="text"
            id="clientName"
            placeholder="Name"
          >

          <input
            type="tel"
            id="clientPhone"
            placeholder="Phone"
          >

          <input
            type="text"
            id="appointmentDate"
            placeholder="Select Date"
          >

          <div id="timeSlots" class="time-slots"></div>

          <select id="serviceSelect">
            <option value="">Service</option>
            <option>Manicure</option>
            <option>Pedicure</option>
          </select>

          <select id="polishSelect">
            <option value="">Polish</option>
            <option>Gel</option>
            <option>Acrylic</option>
          </select>

          <select id="designSelect">
            <option value="">Design</option>
            <option>Basic</option>
            <option>Minimal Design</option>
            <option>Max Design</option>
          </select>

          <select id="additionalServiceSelect">
            <option value="No">Additional Services</option>
            <option>Manicure</option>
            <option>Pedicure</option>
            <option>No</option>
          </select>

          <button onclick="bookAppointment()">
            Book Appointment
          </button>

          <p id="message"></p>

        </div>

      </div>


      <!-- BOOKING CONFIRMATION POPUP -->
      <div id="bookingPopup" class="popup">

        <div class="popup-box">

          <h2>Appointment Booked!</h2>

          <p>
            Your appointment has been successfully scheduled.
          </p>

          <button onclick="closePopup()">
            OK
          </button>

        </div>

      </div>


      <!-- ADDITIONAL SERVICE POPUP -->
      <div id="additionalServicePopup" class="popup">

        <div class="popup-box">

          <h2>Additional Service Details</h2>

          <select id="additionalPolishSelect">
            <option value="">Additional Polish</option>
            <option>Gel</option>
            <option>Acrylic</option>
          </select>

          <select id="additionalDesignSelect">
            <option value="">Additional Design</option>
            <option>Basic</option>
            <option>Minimal Design</option>
            <option>Max Design</option>
          </select>

          <button
            type="button"
            onclick="saveAdditionalServiceOptions()"
          >
            Save
          </button>

        </div>

      </div>

    </section>


    <!-- LOGOUT -->
    <button id="logoutBtn" type="button">
      Logout
    </button>


    <!-- BACK -->
    <a href="index.html" class="back-link">
      Back to Website
    </a>

  </section>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script src="myappointments.js?v=6"></script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
default-src 'self' https:;
script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net;
connect-src 'self' https://*.supabase.co https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://www.gstatic.com;
style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com;
font-src 'self' https://fonts.gstatic.com;
img-src 'self' data: https:;
">
  <title>Eliana's Nail Studio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Pinyon+Script&display=swap" rel="stylesheet">
</head>



<body>

  <div class="background"></div>


  <section class="booking">

    <h2>My Appointments</h2>

    <p id="userEmail"></p>


    <div id="appointments">

      <p>Loading appointments...</p>

    </div>
    <button
      type="button"
      onclick="bookAppointment()"
    >
      Book Appointment
    </button>

    <p id="message"></p>

  </div>

</div>


<!-- BOOKING SUCCESS POPUP -->
<div id="bookingPopup" class="popup">

  <div class="popup-box">

    <h2>Appointment Booked!</h2>

    <p>
      Your appointment has been successfully scheduled.
    </p>

    <button
      type="button"
      onclick="closePopup()"
    >
      OK
    </button>

  </div>

</div>


<!-- ADDITIONAL SERVICE POPUP -->
<div id="additionalServicePopup" class="popup">

  <div class="popup-box additional-service-box">

    <button
      type="button"
      class="popup-close"
      onclick="closeAdditionalServicePopup()"
      aria-label="Close"
    >
      ×
    </button>

    <h2>Add Additional Service</h2>


    <!-- ADDITIONAL SERVICE -->
    <label for="additionalServiceType">
      Service
    </label>

    <select id="additionalServiceType">

      <option value="">
        Select Service
      </option>

      <option value="Manicure">
        Manicure
      </option>

      <option value="Pedicure">
        Pedicure
      </option>

    </select>


    <!-- ADDITIONAL POLISH -->
    <label for="additionalPolishSelect">
      Polish Type
    </label>

    <select id="additionalPolishSelect">

      <option value="">
        Select Polish
      </option>

      <option value="Regular">
        Gel
      </option>

      <option value="Gel">
        Builder Gel
      </option>

      <option value="Acrylic">
        Acrylic
      </option>

    </select>


    <!-- ADDITIONAL DESIGN -->
    <label for="additionalDesignSelect">
      Design
    </label>

    <select id="additionalDesignSelect">

      <option value="">
        Select Design
      </option>

      <option value="Basic">
        Basic
      </option>

      <option value="Minimal Design">
        Minimal Design
      </option>

      <option value="Max Design">
        Max Design
      </option>

    </select>


    <!-- DESIGN DETAILS -->
    <label for="additionalDesignDetails">
      Design Details
    </label>

    <textarea
      id="additionalDesignDetails"
      placeholder="Describe your design..."
      rows="3"
    ></textarea>


    <!-- POPUP BUTTONS -->
    <div class="additional-service-buttons">

      <button
        type="button"
        onclick="closeAdditionalServicePopup()"
      >
        Cancel
      </button>

      <button
        type="button"
        onclick="saveAdditionalServiceOptions()"
      >
        Add Service
      </button>

    </div>

  </div>

</div>
  </section>

    <br>

    <button id="logoutBtn" type="button">
      Logout
    </button>


    <br><br>

    <a href="index.html" class="back-link">
      Back to Website
    </a>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="myappointments.js?v=6"></script>

</html>
